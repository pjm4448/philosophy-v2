# Prepares the environment for Copilot cloud agent (GitHub.com) sessions in this repository.
# The job name must be `copilot-setup-steps`. See:
# https://docs.github.com/en/copilot/how-tos/use-copilot-agents/coding-agent/customize-the-agent-environment
name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out philosophy-v2
        uses: actions/checkout@v4

      - name: Check out source documents (read-only) into ../philosophy
        run: git clone --depth 1 https://github.com/pjm4448/philosophy.git ../philosophy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tool dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Sanity check
        run: |
          python tools/distill.py validate
          python -m pytest tools/tests -q
